[package]
name = "weaponarium_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
dotenvy = "0.15"
anyhow = "1.0"
